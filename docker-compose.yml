version: '3.8'

services:

  # ======================
  # 1. PostgreSQL Database
  # ======================
  hms-db:
    image: postgres:17-alpine
    container_name: hms-db
    restart: always
    environment:
      - POSTGRES_DB=VLU_HMS
      - POSTGRES_PASSWORD=123456789
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c 'max_connections=900'
      -c 'shared_buffers=230MB'
      -c 'effective_cache_size=6400MB'
      -c 'work_mem=4MB'
      -c 'maintenance_work_mem=64MB'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8192M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ======================
  # 2. MinIO Object Storage
  # ======================
  # minio:
  #   image: minio/minio
  #   container_name: minio
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   env_file:
  #     - API/src/AppHost/.env
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio-data:/data
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  # ======================
  # 3. Backend API
  # ======================
  hms-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - API/src/AppHost/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__HopitalManagementDB=Host=hms-db;Database=VLU_HMS;Username=postgres;Password=123456789;Port=5432;Trust Server Certificate=true;
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    depends_on:
      hms-db:
        condition: service_healthy
      # minio:
      #   condition: service_healthy

# ======================
# Volumes
# ======================
volumes:
  pgdata:
  minio-data: